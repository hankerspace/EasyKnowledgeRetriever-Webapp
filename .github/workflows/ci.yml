name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api-tests:
    name: API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (core only, no PDF extra)
        run: |
          python -m pip install --upgrade pip
          pip install "easy-knowledge-retriever>=1.3.0,<2.0" \
                      fastapi "uvicorn[standard]" python-multipart \
                      "pydantic-settings>=2" aiofiles httpx
      - run: python test_api_smoke.py

  docker-image:
    name: Docker image builds and its toolchain imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ekr-ci:latest .

      # The bug this guards against: MinerU imports OpenCV, which links X11/GL
      # libraries that slim base images omit. The image builds fine and only
      # fails minutes into the first PDF ingestion, as a subprocess ImportError.
      - name: PDF toolchain must import
        run: |
          # One line on purpose: a multi-line `python -c` in YAML keeps the
          # block indentation and dies with IndentationError.
          docker run --rm ekr-ci:latest python -c "import torch, torchvision, cv2; import doclayout_yolo.nn.tasks; from mineru.cli.client import main; import mineru.backend.pipeline.pipeline_analyze; print('PDF toolchain OK', torch.__version__, torchvision.__version__)"

      # Guards the ordering bug that once made this image 10.8GB: torch must
      # come from the CPU wheel index, not drag in the whole CUDA stack.
      - name: torch must be the CPU build
        run: |
          docker run --rm ekr-ci:latest python -c "import torch, sys; print('torch', torch.__version__); sys.exit(0 if 'cpu' in torch.__version__ else 1)"
          if docker run --rm ekr-ci:latest pip list 2>/dev/null | grep -qi '^nvidia-'; then
            echo "CUDA packages present in a CPU image"; exit 1
          fi

      - name: Container serves an unauthenticated health endpoint
        run: |
          docker run -d --name ci -p 8080:80 -e EKR_AUTO_INGEST=false ekr-ci:latest
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"healthy"'
          docker rm -f ci
