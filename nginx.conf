# This file replaces Debian's stock /etc/nginx/nginx.conf wholesale, so the
# directives it normally provides have to be restated here. Dropping `user`
# leaves workers running as nobody, which cannot read .htpasswd -- every
# authenticated request then fails with a 500.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Uploaded/ingested payloads and long graph responses.
    client_max_body_size 100M;

    # RAG queries routinely run for minutes (retrieval + query decomposition +
    # reranking + generation). nginx defaults to a 60s read timeout, which
    # turns every non-trivial question into a 504.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 30s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    upstream backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Basic auth, generated by docker-entrypoint.sh from AUTH_USER/AUTH_PASSWORD.
        include /etc/nginx/auth_part.conf;

        root /app/static;
        index index.html;

        # Health endpoints must be reachable without credentials, otherwise
        # every healthcheck and probe gets a 401.
        location /health {
            auth_basic off;
            proxy_pass http://backend;
        }

        location /query {
            # Answers arrive as one block; buffering them adds latency for
            # nothing, and would break SSE if streaming is added later.
            proxy_buffering off;
            proxy_pass http://backend;
        }

        location /rag {
            proxy_pass http://backend;
        }

        location /db {
            proxy_pass http://backend;
        }

        # API docs. Disabled in the backend unless EKR_ENABLE_DOCS=true, in
        # which case they stay behind basic auth.
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend;
        }

        # Frontend: Single Page Application (SPA) support
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
